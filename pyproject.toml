[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-loss-rate"
version = "0.1.0"
description = "Grid-based exoplanet atmospheric mass-loss predictions via neural networks."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Amit Reza" }
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402"] 

